[project]
name = "calculator"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["ollama>=0.6.2"]

[dependency-groups]
dev = ["pytest>=9.0.3", "hypothesis>=6.155.7"]

[tool.pytest]
