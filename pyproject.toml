[project]
name = "calculator"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["ollama>=0.6.2"]

[dependency-groups]
dev = ["pytest>=9.0.3"]

[tool.pytest]
addopts = ["--strict-markers"]
markers = ["fuzz", "slow"]
consider_namespace_packages = true

[tool.black]
skip-magic-trailing-comma = false
target-version = ['py310']
